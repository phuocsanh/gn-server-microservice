#####################################################################
# DOCKER COMPOSE - GN FARM MICROSERVICES STACK
# File này định nghĩa toàn bộ kiến trúc microservices cho GN Farm
#
# Kiến trúc hệ thống:
# ┌─────────────────┐    ┌─────────────────┐    ┌─────────────────┐
# │   Go Server     │    │  Chat Service   │    │    Kafka UI     │
# │   (Backend)     │    │   (Node.js)     │    │  (Monitoring)   │
# │   Port: 8002    │    │   Port: 3001    │    │   Port: 8080    │
# └─────────┬───────┘    └─────────┬───────┘    └─────────────────┘
#           │                      │
#           └──────────┬───────────┘
#                      │
# ┌─────────────────┐  │  ┌─────────────────┐    ┌─────────────────┐
# │   PostgreSQL    │  │  │     Redis       │    │    MongoDB      │
# │ (Main Database) │  │  │   (Cache/RT)    │    │  (Chat Data)    │
# │   Port: 5432    │  │  │   Port: 6381    │    │  Port: 27017    │
# └─────────────────┘  │  └─────────────────┘    └─────────────────┘
#                      │
#                ┌─────────────────┐    ┌─────────────────┐
#                │     Kafka       │    │   Zookeeper     │
#                │ (Message Queue) │    │ (Coordination)  │
#                │   Port: 9092    │    │   Port: 2181    │
#                └─────────────────┘    └─────────────────┘
#
# Tác giả: GN Farm Development Team
# Phiên bản: Docker Compose 3.8
# Cách sử dụng: docker-compose up -d
#####################################################################

version: "3.8"

services:
  # ===== DATABASE SERVICES - CÁC DỊCH VỤ CƠ SỜ DỮU LIỆU =====
  # PostgreSQL - Cơ sở dữ liệu chính cho backend Go server
  postgres:
    image: postgres:15 # Sử dụng PostgreSQL phiên bản 15 (stable LTS)
    container_name: postgres_gn_farm # Tên container cho dễ quản lý
    environment:
      POSTGRES_USER: postgres # Username mặc định
      POSTGRES_PASSWORD: postgres # Password (nên thay đổi trong production)
      POSTGRES_DB: GO_GN_FARM # Database chính cho ứng dụng
    ports:
      - "5432:5432" # Expose port 5432 ra ngoài
    volumes:
      - postgres_data:/var/lib/postgresql/data # Lưu dữ liệu vào volume
    networks:
      - gn_farm_network # Kết nối vào mạng chung
    healthcheck: # Kiểm tra sức khỏe service
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s # Kiểm tra mỗi 10 giây
      timeout: 5s # Timeout 5 giây
      retries: 5 # Thử lại tối đa 5 lần

  # Redis - Cache và session store cho real-time features

  redis:
    image: redis:7.4 # Redis 7.4 cho performance tốt nhất
    container_name: redis_gn_farm # Tên container
    ports:
      - "6381:6379" # Map port 6379 thành 6381 để tránh conflict
    volumes:
      - redis_data:/data # Lưu dữ liệu cache vào volume
    networks:
      - gn_farm_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # Test kết nối Redis
      interval: 10s
      timeout: 5s
      retries: 3

  # MongoDB - Lưu trữ dữ liệu chat, tin nhắn real-time
  mongodb:
    image: mongo:6.0 # MongoDB 6.0 stable
    container_name: mongo_gn_farm
    ports:
      - "27017:27017" # Port mặc định MongoDB
    volumes:
      - mongodb_data:/data/db # Lưu document vào volume
    networks:
      - gn_farm_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"] # Test MongoDB
      interval: 10s
      timeout: 5s
      retries: 3

  # ===== KAFKA MESSAGE QUEUE SERVICES - DỊCH VỤ HÀNG ĐỢI TIN NHẮN =====
  # Zookeeper - Điều phối và quản lý Kafka cluster
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gn_farm_network

  broker:
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker
    restart: unless-stopped
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_MAX_REQUEST_SIZE: 200000000
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 200000000
    networks:
      - gn_farm_network

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    depends_on:
      - broker
    environment:
      KAFKA_CLUSTERS_0_NAME: broker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - gn_farm_network

  # ===== APPLICATION SERVICES - CÁC DỊCH VỤ ỨNG DỤNG =====
  # Go Server - Backend chính xử lý business logic, API, authentication
  go_server:
    container_name: backend_go_gn_farm
    build:
      context: ./gn-farm-go-server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8002:8002"
    volumes:
      - ./gn-farm-go-server:/app:cached
    working_dir: /app
    # CompileDaemon: hot reload go server on .go changes
    command:
      [
        "/go/bin/CompileDaemon",
        "-build",
        "go build -o tmp/main ./cmd/server",
        "-command",
        "./tmp/main",
        "-polling",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_started
    networks:
      - gn_farm_network
    stdin_open: true
    tty: true
    env_file:
      - ./gn-farm-go-server/.env
    environment:
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDER_EMAIL: ${SENDER_EMAIL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  chat_service:
    container_name: chat_service_gn_farm
    build:
      context: ./gn-chat-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - ./gn-chat-service:/app:cached
      - chat_node_modules:/app/node_modules
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - gn_farm_network
    # Use nodemon for hot reloading in development
    command: ["npm", "run", "dev"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongo_gn_farm:27017/gn_chat
      - POSTGRES_HOST=postgres_gn_farm
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-GO_GN_FARM}
      - REDIS_HOST=redis_gn_farm
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-gn_farm_jwt_secret_2024_change_this_in_production}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-AKIAIOSFODNN7EXAMPLE}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-gn-chat-files}
      - ENABLE_IMAGE_COMPRESSION=${ENABLE_IMAGE_COMPRESSION:-true}
      - IMAGE_MAX_DIMENSION=${IMAGE_MAX_DIMENSION:-1920}
      - JPEG_QUALITY=${JPEG_QUALITY:-80}
      - PNG_QUALITY=${PNG_QUALITY:-80}
      - WEBP_QUALITY=${WEBP_QUALITY:-80}
      - ENABLE_VIDEO_COMPRESSION=${ENABLE_VIDEO_COMPRESSION:-true}
      - VIDEO_MAX_WIDTH=${VIDEO_MAX_WIDTH:-1280}
      - VIDEO_MAX_BITRATE=${VIDEO_MAX_BITRATE:-1500k}
      - VIDEO_PRESET=${VIDEO_PRESET:-medium}
      - VIDEO_CRF=${VIDEO_CRF:-23}
      - VIDEO_MAX_SIZE_MB=${VIDEO_MAX_SIZE_MB:-50}

# ===== DOCKER VOLUMES - LƯU TRỮU DỮU LIỆU BỀN VỮNG =====
# Các volume để lưu trữ dữ liệu khi container restart
volumes:
  postgres_data: # Dữ liệu PostgreSQL - users, inventory, transactions
  redis_data: # Dữ liệu Redis - cache, sessions, real-time data
  broker_data: # Dữ liệu Kafka - message queue, events
  mongodb_data: # Dữ liệu MongoDB - chat messages, conversations
  chat_node_modules: # Node modules cho chat service (tăng tốc độ build)

# ===== DOCKER NETWORKS - MẠNG KẾT NỐI =====
# Mạng chung cho tất cả services giao tiếp với nhau
networks:
  gn_farm_network: # Mạng bridge cho toàn bộ microservices
    driver: bridge # Sử dụng bridge driver (mặc định, phù hợp cho dev)
