version: "3.8"

services:
  # Database services
  postgres:
    image: postgres:15
    container_name: postgres_gn_farm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-GnFarm2024SecurePass!}
      POSTGRES_DB: ${POSTGRES_DB:-GO_GN_FARM}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gn_farm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: redis_gn_farm
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - gn_farm_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:6.0
    container_name: mongo_gn_farm
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - gn_farm_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Kafka services
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gn_farm_network

  broker:
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker
    restart: unless-stopped
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_MAX_REQUEST_SIZE: 200000000
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 200000000
    networks:
      - gn_farm_network

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    depends_on:
      - broker
    environment:
      KAFKA_CLUSTERS_0_NAME: broker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - gn_farm_network

  # Application services
  go_server:
    container_name: backend_go_gn_farm
    build:
      context: ./gn-farm-go-server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8002:8002"
    volumes:
      - ./gn-farm-go-server:/app:cached
    working_dir: /app
    # CompileDaemon: hot reload go server on .go changes
    command:
      [
        "/go/bin/CompileDaemon",
        "-build",
        "go build -o tmp/main ./cmd/server",
        "-command",
        "./tmp/main",
        "-polling",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      broker:
        condition: service_started
    networks:
      - gn_farm_network
    stdin_open: true
    tty: true
    env_file:
      - ./gn-farm-go-server/.env
    environment:
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDER_EMAIL: ${SENDER_EMAIL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  chat_service:
    container_name: chat_service_gn_farm
    build:
      context: ./gn-chat-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./gn-chat-service:/app:cached
      - chat_node_modules:/app/node_modules
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - gn_farm_network
    # Use nodemon for hot reloading in development
    command: ["npm", "run", "dev"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongo_gn_farm:27017/gn_chat
      - POSTGRES_HOST=postgres_gn_farm
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-GnFarm2024SecurePass!}
      - POSTGRES_DB=${POSTGRES_DB:-GO_GN_FARM}
      - REDIS_HOST=redis_gn_farm
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-gn_farm_jwt_secret_2024_change_this_in_production}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-AKIAIOSFODNN7EXAMPLE}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-gn-chat-files}
      - ENABLE_IMAGE_COMPRESSION=${ENABLE_IMAGE_COMPRESSION:-true}
      - IMAGE_MAX_DIMENSION=${IMAGE_MAX_DIMENSION:-1920}
      - JPEG_QUALITY=${JPEG_QUALITY:-80}
      - PNG_QUALITY=${PNG_QUALITY:-80}
      - WEBP_QUALITY=${WEBP_QUALITY:-80}
      - ENABLE_VIDEO_COMPRESSION=${ENABLE_VIDEO_COMPRESSION:-true}
      - VIDEO_MAX_WIDTH=${VIDEO_MAX_WIDTH:-1280}
      - VIDEO_MAX_BITRATE=${VIDEO_MAX_BITRATE:-1500k}
      - VIDEO_PRESET=${VIDEO_PRESET:-medium}
      - VIDEO_CRF=${VIDEO_CRF:-23}
      - VIDEO_MAX_SIZE_MB=${VIDEO_MAX_SIZE_MB:-50}

volumes:
  postgres_data:
  redis_data:
  broker_data:
  mongodb_data:
  chat_node_modules:

networks:
  gn_farm_network:
    driver: bridge
